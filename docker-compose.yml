version: '3.8'

services:
  eta-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eta_prediction_service
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=.
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: eta_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - eta-api
    restart: unless-stopped
